# Example Drive Knowledge Agent config. Copy to drive-agent.yaml and edit.
# Secrets (API keys, tokens) do NOT go here: use .env or the environment (see .env.example).
#
# drive.auth_mode:        service_account | oauth
# drive.folder_ids:       folder URLs or IDs (sub-folders are indexed recursively)
# drive.include_mime:     docs, slides, pdf, docx, pptx, txt, md, html, json
#                         (Excel, Google Sheets and CSV are out of scope)
# embeddings.provider:    local (open-source via FastEmbed) | voyage | openai
# embeddings.model:       null = provider default (local: nomic-ai/nomic-embed-text-v1.5)
# vector_store.provider:  qdrant  (chroma | pinecone | pgvector planned)
# vector_store.url:       Qdrant server / Qdrant Cloud URL; null = embedded on disk
# retrieval.hybrid:       dense + BM25 keyword search (changing it needs `sync --full`)
# llm.*_effort:           low | medium | high | xhigh | max
# agent.mode:             rag  (agentic | auto planned)
# agent.checkpointer:     memory | sqlite | postgres
# tracing.provider:       none | langsmith | langfuse
# interfaces.slack.mode:  socket | http

data_dir: .drive-agent
drive:
  auth_mode: service_account
  folder_ids:
  - YOUR_FOLDER_ID_OR_URL
  credentials_file: null
  oauth_client_file: null
  impersonate_user: null
  include_mime:
  - docs
  - slides
  - pdf
  - docx
  - pptx
  - txt
  - md
  max_file_mb: 50
  max_depth: null
ingest:
  chunk_tokens: 800
  chunk_overlap: 120
  contextual_chunks: false
  schedule_cron: 0 */6 * * *
embeddings:
  provider: local
  model: null
vector_store:
  provider: qdrant
  collection: drive_agent
  url: null
  persist_dir: null
retrieval:
  top_k: 20
  final_k: 8
  hybrid: true
  grade: true
llm:
  provider: anthropic
  answer_model: claude-opus-5-5
  answer_effort: medium
  fast_model: claude-haiku-5-5
  fast_effort: low
agent:
  mode: rag
  checkpointer: sqlite
tracing:
  provider: none
interfaces:
  slack:
    mode: socket
    allowed_channels: []
